name: Publish Docker Image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  IMAGE_NAME: media2api

concurrency:
  group: docker-release
  cancel-in-progress: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: python scripts/prepare_release.py --tag "$RELEASE_TAG" --github-output "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=tag
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push image
        id: app
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: app
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: updater
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:updater-${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:updater
          cache-from: type=gha,scope=updater
          cache-to: type=gha,scope=updater,mode=max

      - name: Build and push super-resolution worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: super-resolution
          build-args: APP_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:super-resolution-${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:super-resolution
          cache-from: |
            type=gha
            type=gha,scope=super-resolution
          cache-to: type=gha,scope=super-resolution,mode=max

      - name: Publish release after all images are ready
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE_DIGEST: ${{ steps.app.outputs.digest }}
        run: |
          python scripts/prepare_release.py --tag "$RELEASE_TAG" --digest "$IMAGE_DIGEST" --output /tmp/media2api-release
          gh release create "$RELEASE_TAG" /tmp/media2api-release/media2api-release.json --verify-tag --title "media2api $RELEASE_TAG" --notes-file /tmp/media2api-release/release-notes.md
