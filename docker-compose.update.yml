# 与主 Compose 文件一起使用；首次启用见 docs/version-updates.md。
services:
  app:
    labels:
      io.media2api.updater.managed: "true"
    environment:
      MEDIA2API_UPDATE_DIR: /run/media2api-update
    volumes:
      - media2api-update:/run/media2api-update

  updater:
    image: ghcr.io/777aca/media2api:updater
    build:
      context: .
      target: updater
    restart: unless-stopped
    environment:
      MEDIA2API_UPDATE_DIR: /state
      MEDIA2API_UPDATE_CONTAINER: ${MEDIA2API_UPDATE_CONTAINER:-media2api}
      MEDIA2API_UPDATE_HEALTH_PORT: ${MEDIA2API_UPDATE_HEALTH_PORT:-80}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - media2api-update:/state
    read_only: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import json,time; s=json.load(open('/state/heartbeat.json')); assert s['ready'] and time.time()-s['time']<30"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  media2api-update:
